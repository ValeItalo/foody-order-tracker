spring.application.name=order-tracker

# SQLite
spring.datasource.url=jdbc:sqlite:orders.db?foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# JWT (segredo vem da variável de ambiente JWT_SECRET; o padrão é só para desenvolvimento)
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me-0123456789}
app.jwt.expiration-minutes=60